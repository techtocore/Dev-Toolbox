name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Angular 22 requires Node ^22.22.3 || ^24.15.0 || >=26. Node 24 is LTS.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build Angular app
        run: npm run build -- --base-href /Dev-Toolbox/

      - name: Add SPA 404 fallback
        # GitHub Pages serves 404.html for unknown paths. Copying index.html
        # lets the Angular router handle deep links and show our 404 page.
        run: cp ./dist/dev-toolbox/browser/index.html ./dist/dev-toolbox/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/dev-toolbox/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
