<div>
  <br />
  <h2>UUID Generator</h2>
  <br />
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="controls">
          <label for="count"><strong>Number of UUIDs:</strong></label>
          <input type="number" id="count" [(ngModel)]="count" min="1" max="100" class="form-control count-input" />
          <button class="btn custom-btn" (click)="generate()">
            <i class="bi bi-arrow-clockwise"></i> Generate
          </button>
          <button class="btn custom-btn" (click)="copyAll()" [disabled]="uuids.length === 0">
            <i class="bi bi-clipboard"></i> Copy All
          </button>
          <button class="btn custom-btn" (click)="clear()" [disabled]="uuids.length === 0">
            Clear
          </button>
        </div>

        <div class="uuid-list">
          @for (uuid of uuids; track uuid) {
            <div class="uuid-item">
              <input type="text" readonly [value]="uuid" class="form-control" />
              <button class="btn btn-sm custom-btn" (click)="copyToClipboard(uuid)" title="Copy to clipboard">
                <i class="bi bi-clipboard"></i>
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
