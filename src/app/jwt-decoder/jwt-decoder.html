<div>
  <br />
  <h2>JWT Decoder</h2>
  <br />
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-6 col-md-12">
        <h5>JWT Token Input</h5>
        <textarea class="data-input bg-light-custom" [(ngModel)]="jwtInput"
          (ngModelChange)="decodeJwt()"
        placeholder="Paste your JWT token here (e.g., eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c)"></textarea>
        <button class="btn custom-btn margin-top-10px" (click)="clear()">
          Clear
        </button>
      </div>

      <div class="col-lg-6 col-md-12">
        <h5>Decoded JWT</h5>

        @if (errorMessage) {
          <div class="alert alert-danger">
            {{ errorMessage }}
          </div>
        }

        @if (isValid) {
          <div>
            <div class="output-section">
              <label><strong>Header:</strong></label>
              <div class="output-box">
                <pre class="data-output bg-light-custom">{{ header }}</pre>
                <button class="btn btn-sm custom-btn copy-btn" (click)="copyToClipboard(header)"
                  title="Copy to clipboard">
                  <i class="bi bi-clipboard"></i>
                </button>
              </div>
            </div>
            <div class="output-section">
              <label><strong>Payload:</strong></label>
              <div class="output-box">
                <pre class="data-output bg-light-custom">{{ payload }}</pre>
                <button class="btn btn-sm custom-btn copy-btn" (click)="copyToClipboard(payload)"
                  title="Copy to clipboard">
                  <i class="bi bi-clipboard"></i>
                </button>
              </div>
            </div>
            <div class="output-section">
              <label><strong>Signature:</strong></label>
              <div class="output-box">
                <input type="text" readonly [value]="signature" class="form-control" />
                <button class="btn btn-sm custom-btn" (click)="copyToClipboard(signature)"
                  title="Copy to clipboard">
                  <i class="bi bi-clipboard"></i>
                </button>
              </div>
            </div>
            <div class="info-box">
              <i class="bi bi-info-circle"></i>
              <small>Note: This tool only decodes the JWT. It does not verify the signature.</small>
            </div>
          </div>
        }

        @if (!isValid && !errorMessage) {
          <div class="empty-state bg-light-custom">
            <i class="bi bi-shield-lock"></i>
            <p>Paste a JWT token to decode it</p>
          </div>
        }
      </div>
    </div>
  </div>
</div>
